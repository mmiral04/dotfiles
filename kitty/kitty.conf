# BEGIN_KITTY_THEME
# Afterglow
include current-theme.conf
# END_KITTY_THEME
action_alias enable disable

# colors
dynamic_background_opacity yes
background_opacity 0.9
color4 #e0412f

# BEGIN_KITTY_FONTS
font_family      family="Adwaita Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
